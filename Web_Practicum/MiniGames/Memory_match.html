<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기억력 카드 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fdf6e3;
    --accent: #ffa600;
    --green: #2ecc71;
    --red: #ff6b6b;
    --text: #2c2c2c;
    --shadow: #e0c97f;
    --card-back: #ff6b6b;
  }

  body {
    background: #e9e1c5;
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    overflow: hidden;
  }

  /* 740x580 고정 해상도 컨테이너로 수정됨 */
  #game-container {
    width: 740px;
    height: 580px;
    position: relative;
    background: var(--bg);
    background-image: radial-gradient(circle, #e8d8a0 1px, transparent 1px);
    background-size: 28px 28px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    transform-origin: center center;
  }

  h1 {
    font-family: 'Jua', sans-serif;
    font-size: 2rem;
    color: var(--card-back);
    letter-spacing: -1px;
    text-shadow: 3px 3px 0 var(--shadow);
    margin-bottom: 4px;
  }

  .round-bar {
    display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; width: 100%;
  }
  .round-dot {
    width: 24px; height: 24px; border-radius: 50%; background: #e8dfc0; border: 2px solid #d4c87a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Jua', sans-serif; font-size: 0.65rem; color: #bbb;
    transition: background 0.3s, border-color 0.3s, transform 0.2s;
  }
  .round-dot.done   { background: var(--green); border-color: #1a9950; color: #fff; }
  .round-dot.active { background: var(--accent); border-color: #c47f00; color: #fff; transform: scale(1.1); }

  .hud {
    display: flex; gap: 12px; margin-bottom: 10px; background: #fff;
    border: 2px solid var(--shadow); border-radius: 50px; padding: 4px 16px;
    box-shadow: 3px 3px 0 var(--shadow); justify-content: center;
  }
  .hud-item { text-align: center; min-width: 48px; }
  .hud-label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
  .hud-value { font-family: 'Jua', sans-serif; font-size: 1.1rem; color: var(--text); }

  .theme-badge {
    font-family: 'Jua', sans-serif; font-size: 0.85rem; background: #fff;
    border: 2px solid var(--shadow); border-radius: 50px; padding: 2px 14px;
    color: var(--text); box-shadow: 2px 2px 0 var(--shadow); margin-bottom: 10px;
  }

  .grid-wrap {
    width: 100%; flex: 1;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .grid { display: grid; gap: 4px; }

  .card { aspect-ratio: 1 / 1; perspective: 600px; cursor: pointer; flex-shrink: 0; }
  .card-inner {
    width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
    transition: transform 0.4s cubic-bezier(.4,2,.55,.8); border-radius: 8px;
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 2px solid; font-size: 1.8rem;
  }
  .card-back { background: var(--card-back); border-color: #e05555; box-shadow: 2px 2px 0 #c0392b; }
  .card-back::after { content: '?'; font-family: 'Jua', sans-serif; color: rgba(255,255,255,0.7); }
  .card-front { background: #fff9f0; border-color: var(--shadow); box-shadow: 2px 2px 0 var(--shadow); transform: rotateY(180deg); }
  .card.matched .card-face.card-front {
    background: #e8fff0; border-color: #a8e6c0; box-shadow: 2px 2px 0 #a8e6c0; animation: pop 0.3s ease;
  }
  .card.wrong .card-face.card-front { animation: shake 0.4s ease; background: #fff0f0; border-color: #ffaaaa; }

  @keyframes pop { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.18); } 100% { transform: rotateY(180deg) scale(1); } }
  @keyframes shake { 0%,100% { transform: rotateY(180deg) translateX(0); } 25% { transform: rotateY(180deg) translateX(-4px); } 75% { transform: rotateY(180deg) translateX(4px); } }

  .btn {
    font-family: 'Jua', sans-serif; font-size: 0.95rem; background: var(--accent); color: #fff;
    border: none; border-radius: 50px; padding: 6px 24px; cursor: pointer;
    box-shadow: 3px 3px 0 #c47f00; transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 #c47f00; }
  .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #c47f00; }
  .btn.red { background: var(--red); box-shadow: 3px 3px 0 #c0392b; }
  .btn.red:hover { box-shadow: 4px 4px 0 #c0392b; }

  .overlay {
    display: none; position: absolute; inset: 0; background: rgba(253,246,227,0.92);
    z-index: 100; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; backdrop-filter: blur(2px); border-radius: 12px;
  }
  .overlay.show { display: flex; }
  .overlay-icon { font-size: 3.5rem; animation: popIn 0.4s cubic-bezier(.4,2,.55,.8); }
  .overlay-title { font-family: 'Jua', sans-serif; font-size: 2rem; color: var(--card-back); text-shadow: 3px 3px 0 var(--shadow); animation: popIn 0.4s 0.05s both cubic-bezier(.4,2,.55,.8); }
  .overlay-sub { color: #888; font-size: 0.9rem; animation: popIn 0.4s 0.1s both cubic-bezier(.4,2,.55,.8); }
  .overlay-stats { display: flex; gap: 14px; background: #fff; border: 2px solid var(--shadow); border-radius: 50px; padding: 6px 20px; box-shadow: 3px 3px 0 var(--shadow); animation: popIn 0.4s 0.15s both cubic-bezier(.4,2,.55,.8); }
  .overlay-stat { text-align: center; }
  .overlay-stat .lbl { font-size: 0.6rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
  .overlay-stat .val { font-family: 'Jua', sans-serif; font-size: 1.3rem; color: var(--text); }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .btns-row { display: flex; gap: 10px; animation: popIn 0.4s 0.2s both cubic-bezier(.4,2,.55,.8); }
</style>
</head>
<body>

<div id="game-container">
  <h1>🃏 기억력 카드</h1>
  <div class="round-bar" id="roundBar"></div>
  <div class="hud">
    <div class="hud-item"><div class="hud-label">라운드</div><div class="hud-value" id="hudRound">1 / 10</div></div>
    <div class="hud-item"><div class="hud-label">시도</div><div class="hud-value" id="hudMoves">0</div></div>
    <div class="hud-item"><div class="hud-label">쌍</div><div class="hud-value" id="hudPairs">0 / ?</div></div>
    <div class="hud-item"><div class="hud-label">시간</div><div class="hud-value" id="hudTimer">0s</div></div>
    <div class="hud-item"><div class="hud-label">점수</div><div class="hud-value" id="hudScore">0</div></div>
  </div>
  <div class="theme-badge" id="themeBadge">🐾 동물</div>
  
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>
  
  <button class="btn red" id="restartBtn">처음부터</button>

  <div class="overlay" id="overlay">
    <div class="overlay-icon" id="ovIcon">🎉</div>
    <div class="overlay-title" id="ovTitle">라운드 클리어!</div>
    <div class="overlay-sub" id="ovSub">다음 라운드로 이동합니다</div>
    <div class="overlay-stats">
      <div class="overlay-stat"><div class="lbl">라운드</div><div class="val" id="ovRound">-</div></div>
      <div class="overlay-stat"><div class="lbl">시간</div><div class="val" id="ovTime">-</div></div>
      <div class="overlay-stat"><div class="lbl">시도</div><div class="val" id="ovMoves">-</div></div>
      <div class="overlay-stat"><div class="lbl">점수</div><div class="val" id="ovScore">-</div></div>
    </div>
    <div class="btns-row"><button class="btn" id="nextBtn">다음 라운드 →</button></div>
  </div>
</div>

<script>
// ── Window Resize Scaling Logic ──
// 최대 740x580 사이즈를 유지하며 창이 작아질 경우 비율에 맞게 스케일 다운
function handleResize() {
  const container = document.getElementById('game-container');
  const scaleX = window.innerWidth / 740;
  const scaleY = window.innerHeight / 580;
  const scale = Math.min(scaleX, scaleY, 1); 
  container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', handleResize);
handleResize(); 

const ROUNDS = [
  { cols: 2,  rows: 2,  pairs: 2  },
  { cols: 4,  rows: 4,  pairs: 8  },
  { cols: 4,  rows: 6,  pairs: 12 },
  { cols: 6,  rows: 6,  pairs: 18 },
  { cols: 6,  rows: 8,  pairs: 24 },
  { cols: 8,  rows: 8,  pairs: 32 },
  { cols: 8,  rows: 10, pairs: 40 },
  { cols: 10, rows: 10, pairs: 50 },
  { cols: 10, rows: 12, pairs: 60 },
  { cols: 12, rows: 12, pairs: 72 },
];

const THEMES = [
  { name: '🐾 동물',    pool: ['🐶','🐱'] },
  { name: '🍎 과일',    pool: ['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥭'] },
  { name: '🚗 탈것',    pool: ['🚗','✈️','🚀','🚢','🚂','🏎️','🚁','⛵','🛸','🚤','🛵','🚌'] },
  { name: '😀 표정',    pool: ['😀','😂','🥹','😍','🤩','😎','🥳','😤','🤔','😴','🤯','🥸','😇','🤠','😈','🫠','🥴','😵'] },
  { name: '🌍 자연',    pool: ['🌸','🌊','🌋','🌈','☁️','❄️','🌙','⭐','🌿','🍄','🌺','🦋','🌵','🌴','🌻','🌾','🌏','🦀','🐚','🪸','🍃','🌤️','🌦️','🌩️'] },
  { name: '🍕 음식',    pool: ['🍕','🍔','🌮','🍣','🍜','🍦','🎂','🍩','🥐','🥗','🍱','🧁','🥩','🍟','🧆','🥘','🍲','🥣','🥙','🫔','🌯','🍛','🍝','🍠','🫕','🥞','🧇','🥓','🍗','🥚','🫙','🧀'] },
  { name: '⚽ 스포츠',  pool: ['⚽','🏀','🎾','⚾','🏐','🏈','🥊','🏓','🎳','🏒','🏸','🤿','🎯','🏹','🥋','🛹','🏄','🧗','🏊','🚵','🤸','⛷️','🏋️','🤼','🤺','🏇','🥌','🛼','🪃','🏑','🥅','🎿','🛷','🪁','🏌️','🏄','🚣','🤽','🪂','🎣'] },
  { name: '🎸 악기',    pool: ['🎸','🎹','🎺','🎻','🥁','🪗','🎷','🪘','🎙️','🎵','🎼','🪕','🔔','📯','🪣','🎤','🎧','📻','🎚️','🎛️','🪗','🎶','🔕','🎉','🎊','🎈','🎀','🎁','🏮','🪔','🕯️','💡','🔦','🪄','🎭','🎨','🖼️','🎪','🎠','🎡','🎢','🎟️','🎫','🎬','🎥','📽️','🎞️','📺','📷','📸'] },
  { name: '🏠 건물',    pool: ['🏠','🏰','🏯','⛩️','🕌','🗼','🗽','⛪','🏛️','🏟️','🛕','🏗️','🏬','🏦','🏥','🏨','🏩','🏪','🏫','🏭','🏢','🏣','🏤','🏡','⛺','🏕️','🛖','🌃','🌆','🌇','🌉','🌁','🗺️','🧭','🗾','🏔️','⛰️','🌋','🗻','🏕️','🏖️','🏜️','🏝️','🏞️','🛤️','🛣️','🌐','🗿','🗺️','🏟️','🏛️','🕍','🕋','⛩️','🛕','🏯','🏰','🗼','🗽','🗻','🏔️'] },
  { name: '🔮 마법',    pool: ['🔮','🌀','💎','⚡','🔥','💫','🌟','🧿','🪄','🌙','💜','🔱','🧲','🪬','✨','🌈','🦄','🧚','🧜','🧝','🧞','🧟','🧙','🐉','🦋','🌺','💫','⭐','🌙','☄️','🌊','🏔️','🌋','🌌','🪐','🌠','🌃','🎆','🎇','🧨','🎑','🎐','🎏','🎋','🎍','🎎','🎑','🎃','🎄','🎆','🎇','🧧','🎊','🎉','🎈','🎀','🎁','🏮','🪔','🕯️','💡','🔮','🌀','💎','⚡','🔥','💫','🌟','🧿','🪄','🌙'] },
];

let round = 1, totalScore = 0;
let flipped = [], matchedCount = 0, moves = 0, lock = false;
let seconds = 0, timerInterval = null, started = false;

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function stopTimer() { clearInterval(timerInterval); timerInterval = null; }
function startTimer() {
  if (started) return;
  started = true;
  timerInterval = setInterval(() => { seconds++; document.getElementById('hudTimer').textContent = seconds + 's'; }, 1000);
}

function buildDots() {
  const bar = document.getElementById('roundBar');
  bar.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const d = document.createElement('div');
    d.className = 'round-dot' + (i < round ? ' done' : i === round ? ' active' : '');
    d.textContent = i;
    bar.appendChild(d);
  }
}

function initRound(r) {
  round = r;
  const cfg = ROUNDS[r - 1];
  const theme = THEMES[r - 1];

  flipped = []; matchedCount = 0; moves = 0; lock = false;
  seconds = 0; started = false;
  stopTimer();

  document.getElementById('hudRound').textContent  = r + ' / 10';
  document.getElementById('hudMoves').textContent  = '0';
  document.getElementById('hudPairs').textContent  = '0 / ' + cfg.pairs;
  document.getElementById('hudTimer').textContent  = '0s';
  document.getElementById('hudScore').textContent  = totalScore;
  document.getElementById('themeBadge').textContent = theme.name;
  document.getElementById('overlay').classList.remove('show');

  buildDots();

  const gridWrap = document.querySelector('.grid-wrap');
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const gap = 4; 

  const wrapW = gridWrap.clientWidth || 700; 
  const wrapH = gridWrap.clientHeight || 380;

  const cardSizeW = Math.floor((wrapW - gap * (cfg.cols - 1)) / cfg.cols);
  const cardSizeH = Math.floor((wrapH - gap * (cfg.rows - 1)) / cfg.rows);
  const cardSize = Math.min(cardSizeW, cardSizeH);

  const fontSize = cardSize >= 40 ? 1.8 : cardSize >= 30 ? 1.4 : cardSize >= 20 ? 1.0 : 0.7;
  
  grid.style.gridTemplateColumns = `repeat(${cfg.cols}, ${cardSize}px)`;
  grid.style.gridTemplateRows    = `repeat(${cfg.rows}, ${cardSize}px)`;
  grid.style.gap = gap + 'px';
  grid.className = 'grid';

  const chosen = shuffle(theme.pool).slice(0, cfg.pairs);
  const deck = shuffle([...chosen, ...chosen]);

  deck.forEach(emoji => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.width  = cardSize + 'px';
    card.style.height = cardSize + 'px';
    card.dataset.emoji = emoji;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back" style="font-size:${fontSize * 0.8}rem"></div>
        <div class="card-face card-front" style="font-size:${fontSize}rem">${emoji}</div>
      </div>`;
    card.addEventListener('click', () => onFlip(card));
    grid.appendChild(card);
  });
}

function onFlip(card) {
  if (lock) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  startTimer();

  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    lock = true; moves++;
    document.getElementById('hudMoves').textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const cfg = ROUNDS[round - 1];
  if (a.dataset.emoji === b.dataset.emoji) {
    setTimeout(() => {
      a.classList.remove('flipped'); a.classList.add('matched');
      b.classList.remove('flipped'); b.classList.add('matched');
      matchedCount++;
      document.getElementById('hudPairs').textContent = matchedCount + ' / ' + cfg.pairs;
      flipped = []; lock = false;
      if (matchedCount === cfg.pairs) {
        stopTimer();
        const timeBonus  = Math.max(0, 120 - seconds) * 2;
        const effBonus   = Math.max(0, (cfg.pairs * 2 - moves)) * 5;
        const roundScore = cfg.pairs * 10 + timeBonus + effBonus;
        totalScore += roundScore;
        document.getElementById('hudScore').textContent = totalScore;
        setTimeout(() => showRoundEnd(roundScore), 400);
      }
    }, 300);
  } else {
    setTimeout(() => {
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(() => {
        a.classList.remove('flipped', 'wrong'); b.classList.remove('flipped', 'wrong');
        flipped = []; lock = false;
      }, 500);
    }, 600);
  }
}

function showRoundEnd(roundScore) {
  const isFinal = round === 10;
  document.getElementById('ovIcon').textContent   = isFinal ? '🏆' : '🎉';
  document.getElementById('ovTitle').textContent  = isFinal ? '게임 클리어!' : `라운드 ${round} 클리어!`;
  document.getElementById('ovSub').textContent    = isFinal ? `최종 점수: ${totalScore}점` : `+${roundScore}점 획득!`;
  document.getElementById('ovRound').textContent  = round + ' / 10';
  document.getElementById('ovTime').textContent   = seconds + 's';
  document.getElementById('ovMoves').textContent  = moves;
  document.getElementById('ovScore').textContent  = totalScore;

  const nextBtn = document.getElementById('nextBtn');
  if (isFinal) {
    nextBtn.textContent = '처음부터 다시';
    nextBtn.onclick = () => { totalScore = 0; document.getElementById('hudScore').textContent = 0; initRound(1); };
  } else {
    nextBtn.textContent = `라운드 ${round + 1} 시작 →`;
    nextBtn.onclick = () => initRound(round + 1);
  }
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('restartBtn').addEventListener('click', () => { totalScore = 0; initRound(1); });

setTimeout(() => { initRound(1); }, 50);
</script>
</body>
</html>
